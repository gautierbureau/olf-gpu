#
# Guard for the java2cuda equation codegen. The hand-written OLF equation Java
# (src/main/java, byte-identical to upstream) is the SINGLE SOURCE OF TRUTH; the
# fused CUDA kernels + scatter tables in native/cuda/equations/generated are parsed and transpiled
# from it (codegen/java2cuda, stdlib parser + one Jinja template — no SymPy:
# OLF hand-writes both the values and the Jacobian, nothing is derived).
#
#   render-up-to-date  re-parses + re-renders and fails on any diff — catches a
#                      hand-edit of a generated kernel, a stale render, AND an
#                      upstream formula change that was not re-rendered (that is
#                      the drift alert this architecture is built around).
#   formulas-proven    numeric, formatting-robust: parsed exprs == the frozen
#                      golden manifest (1e-12), a finite-difference audit of
#                      OLF's own hand-written Jacobian, the rendered kernels ==
#                      the committed ones, and the scatter stamps == the real
#                      equation-system wiring.
#                      For a RULE family (an outer loop's decisions): parse ==
#                      golden, render == committed, and the committed header
#                      compiled for the host (g++, no GPU) gives the Java's
#                      result on every reference vector OLF's own test keeps.
#
# This is the ONLY place python touches the project; the normal Maven build and
# every contributor stay python-free.
name: codegen-check

on:
  push:
  pull_request:

# The OLF Java the kernels are generated from, checked out next to the sources at OLF_SRC. It is normally the
# powsybl-open-loadflow branch the extension builds on (maven.yml: olf-local-patches).
# TEMPORARY: OLF_REF is the reactive limits pilot's branch, olf-local-patches plus ReactiveLimitsDecisions and its
# reference vectors, which the reactive_limits_decisions rule family is generated from and proven against. Put
# olf-local-patches back once those commits are on it — and not before: the family's Java is not there yet.
env:
  OLF_SRC: ${{ github.workspace }}/deps/powsybl-open-loadflow
  OLF_REF: claude/hopeful-edison-8lqr3p

jobs:
  render-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: gautierbureau/powsybl-open-loadflow
          ref: ${{ env.OLF_REF }}
          path: deps/powsybl-open-loadflow

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pinned Jinja
        run: pip install -r codegen/requirements.txt

      - name: Render the fused kernels + scatter tables from the OLF Java
        run: python3 codegen/java2cuda/java2cuda.py

      - name: Alert if generated kernels are stale or hand-edited
        run: |
          if ! git diff --quiet; then
            echo "::warning::native/cuda/equations/generated kernels differ from a fresh render of the OLF Java."
            echo "If you changed a formula method in src/main/java: run codegen/regenerate.sh and commit."
            echo "If a kernel file was hand-edited: revert it — kernels are generated from the Java."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "Generated kernels are up to date with the OLF Java."

  formulas-proven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: gautierbureau/powsybl-open-loadflow
          ref: ${{ env.OLF_REF }}
          path: deps/powsybl-open-loadflow

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pinned Jinja
        run: pip install -r codegen/requirements.txt

      - name: Prove (parse==golden, FD audit, rendered==committed, rendered==golden)
        run: python3 codegen/java2cuda/prove.py

      - name: Check scatter stamps match OLF equation-system wiring
        run: python3 codegen/check_scatter.py
